# Section "Admin token, compose file, first start" of https://bitvps.com/guides/self-host-vaultwarden-password-manager
# Read the guide before running anything: these are the command blocks as they appear
# in the text, kept in order. Values in angle brackets, example hostnames, IPs and
# passwords must be replaced with your own.

# /opt/vaultwarden/compose.yaml
services:
  vaultwarden:
    image: vaultwarden/server:1.37.4   # check the releases page; pin, do not use :latest
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./data:/data
    environment:
      DOMAIN: "https://vault.example.com"
      SIGNUPS_ALLOWED: "true"           # set to "false" after you create your account
      ADMIN_TOKEN: "$$argon2id$$v=19$$m=19456,t=2,p=1$$PASTE$$THE_REST"
      LOG_FILE: "/data/vaultwarden.log"
      LOG_LEVEL: "warn"
      SHOW_PASSWORD_HINT: "false"
      SENDS_ALLOWED: "true"
      ATTACHMENT_LIMIT: "100000"         # KB per user, optional cap
