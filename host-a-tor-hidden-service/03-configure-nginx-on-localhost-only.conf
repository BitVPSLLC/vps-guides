# Section "Configure nginx on localhost only" of https://bitvps.com/guides/host-a-tor-hidden-service
# Read the guide before running anything: these are the command blocks as they appear
# in the text, kept in order. Values in angle brackets, example hostnames, IPs and
# passwords must be replaced with your own.

# /etc/nginx/sites-available/onion
server {
    listen 127.0.0.1:8080;
    server_name _;

    root /var/www/onion;
    index index.html;

    server_tokens off;
    access_log off;
    error_log /var/log/nginx/onion-error.log warn;

    # Do not let nginx redirect to its own hostname/IP.
    absolute_redirect off;
    port_in_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ =404;
    }
}
