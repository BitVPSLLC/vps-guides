# Section "Bitcoin Core: unpruned, with the REST interface on" of https://bitvps.com/guides/run-an-electrum-server-on-a-vps
# Read the guide before running anything: these are the command blocks as they appear
# in the text, kept in order. Values in angle brackets, example hostnames, IPs and
# passwords must be replaced with your own.

# /etc/bitcoin/bitcoin.conf
server=1
rest=1
prune=0
txindex=0
dbcache=16000          # for initial sync on 192 GB RAM; lower to 2000 afterwards
maxconnections=60
listen=1

rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpccookieperms=group   # lets the electrs user read .cookie
