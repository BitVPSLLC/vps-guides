# Section "lnd.conf and a systemd unit" of https://bitvps.com/guides/run-a-lightning-node-on-a-vps
# Read the guide before running anything: these are the command blocks as they appear
# in the text, kept in order. Values in angle brackets, example hostnames, IPs and
# passwords must be replaced with your own.

# /etc/lnd/lnd.conf
[Application Options]
alias=YOUR-ALIAS
color=#ff9900
debuglevel=info
maxpendingchannels=2
minchansize=100000
accept-keysend=true

# Auto-unlock after reboot. Ignored on first start while no wallet exists yet.
wallet-unlock-password-file=/etc/lnd/password.txt
wallet-unlock-allow-create=true

# Tor-only: no clearnet listener. The onion service provides inbound.
listen=localhost
rpclisten=localhost:10009
restlisten=localhost:8080

[Bitcoin]
bitcoin.mainnet=true
bitcoin.node=bitcoind

[Bitcoind]
bitcoind.dir=/var/lib/bitcoind
bitcoind.config=/etc/bitcoin/bitcoin.conf
bitcoind.rpccookie=/var/lib/bitcoind/.cookie
bitcoind.rpchost=127.0.0.1
bitcoind.zmqpubrawblock=tcp://127.0.0.1:28332
bitcoind.zmqpubrawtx=tcp://127.0.0.1:28333
bitcoind.pruned-node-max-peers=4

[tor]
tor.active=true
tor.v3=true
tor.streamisolation=true
tor.socks=127.0.0.1:9050
tor.control=127.0.0.1:9051
tor.privatekeypath=/var/lib/lnd/v3_onion_private_key

[wtclient]
wtclient.active=true
