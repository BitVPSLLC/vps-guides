# Section "Bitcoin Core: pruned, ZMQ, Tor-only" of https://bitvps.com/guides/run-a-lightning-node-on-a-vps
# Read the guide before running anything: these are the command blocks as they appear
# in the text, kept in order. Values in angle brackets, example hostnames, IPs and
# passwords must be replaced with your own.

# /etc/bitcoin/bitcoin.conf
server=1
prune=20000
dbcache=1000
maxconnections=40
txindex=0

# RPC on localhost with cookie auth. The lnd user is in the bitcoin group.
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpccookieperms=group

# ZMQ notifications for LND
zmqpubrawblock=tcp://127.0.0.1:28332
zmqpubrawtx=tcp://127.0.0.1:28333

# Tor only: outbound through the SOCKS port, inbound via an onion service.
proxy=127.0.0.1:9050
listen=1
listenonion=1
onlynet=onion
torcontrol=127.0.0.1:9051
